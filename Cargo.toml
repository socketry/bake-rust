[workspace]
members = ["crates/macros", "crates/cargo-bake", "bake"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/socketry/bake-rust"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
tempfile = "3.27"
linkme = "0.3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[package]
name = "socketry-bake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable, typed development tasks for Rust projects"
readme = "readme.md"
include = ["src/**", "Cargo.toml", "readme.md", "license.md", "releases.md", "conventions.md", "agent-context.md", "design.md", "task-libraries.md", "releasing.md"]

[lib]
name = "bake"

[dependencies]
serde.workspace = true
serde_json.workspace = true
linkme.workspace = true
bake-macros = { version = "0.1.0", path = "crates/macros" }

[dev-dependencies]
tempfile.workspace = true
