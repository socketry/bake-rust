[workspace]
members = ["crates/macros", "crates/cargo-bake", "bake"]
resolver = "3"

[workspace.package]
version = "0.17.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/socketry/bake-rust"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
tempfile = "3.27"
linkme = "0.3"
toml_edit = "0.25"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["socketry/managers"]

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/socketry/bake-agent-context-rust"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/socketry/bake-cargo-rust"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/socketry/bake-license-rust"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/socketry/bake-readme-rust"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/socketry/bake-releases-rust"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/socketry/bake-test-rust"
branch = "main"

[package]
name = "bake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable, typed development tasks for Rust projects"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[lib]
name = "bake"

[dependencies]
serde.workspace = true
serde_json.workspace = true
linkme.workspace = true
bake-macros = { version = "0.17.4", path = "crates/macros" }

[dev-dependencies]
tempfile.workspace = true

[patch.crates-io]
bake = { path = "." }
