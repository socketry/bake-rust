name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Check out the release task libraries for local development
        run: |
          git clone --depth 1 --branch main https://github.com/socketry/bake-releases-rust.git ../bake-releases-rust
          git clone --depth 1 --branch main https://github.com/socketry/bake-cargo-rust.git ../bake-cargo-rust
          git clone --depth 1 --branch main https://github.com/socketry/bake-license-rust.git ../bake-license-rust
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace and documentation tests
        run: cargo test --workspace --locked
      - name: Exercise project task discovery
        run: cargo bake --locked --list
      - name: Exercise typed tasks and release library
        run: |
          cargo bake --locked greet Samuel --excited true
          cargo bake --locked greet Samuel output --format json
          cargo bake --locked add 20 22 :: result
          cargo bake --locked greet Samuel :: null
          cargo bake --locked releases:notes v0.1.0

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check out the release task libraries for local development
        run: |
          git clone --depth 1 --branch main https://github.com/socketry/bake-releases-rust.git ../bake-releases-rust
          git clone --depth 1 --branch main https://github.com/socketry/bake-cargo-rust.git ../bake-cargo-rust
          git clone --depth 1 --branch main https://github.com/socketry/bake-license-rust.git ../bake-license-rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
