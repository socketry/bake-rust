name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install Bake launcher
        run: cargo install socketry-cargo-bake --locked
      - name: Run workspace tests with Bake
        if: runner.os != 'Windows'
        run: cargo bake --locked test
      - name: Run workspace tests with Cargo on Windows
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked
      - name: Exercise task discovery and invocation
        run: |
          cargo bake --locked --list
          cargo bake --locked greet Samuel --excited true
          cargo bake --locked greet Samuel output --format json
          cargo bake --locked add 20 22 :: result
          cargo bake --locked greet Samuel :: null
          cargo bake --locked releases:notes v0.1.0

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - name: Install Bake launcher
        run: cargo install socketry-cargo-bake --locked
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests and require complete line coverage
        run: cargo bake --locked test:coverage --all-targets true
