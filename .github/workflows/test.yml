name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install Bake launcher
        run: cargo install socketry-cargo-bake --locked
      - name: Run workspace tests with Bake
        if: runner.os != 'Windows'
        run: cargo bake --locked test
      - name: Exercise task discovery and invocation
        run: |
          cargo bake --locked --list
          cargo bake --locked greet Samuel --excited true
          cargo bake --locked greet Samuel output --format json
          cargo bake --locked add 20 22 :: result
          cargo bake --locked greet Samuel :: null
          cargo bake --locked releases:notes v0.1.0

  coverage:
    name: Coverage (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, llvm-tools-preview, rustfmt
          # Isolate this source-installed tool from the old prebuilt-action cache.
          cache-shared-key: coverage-cargo-install-v1
      - name: Install Bake launcher
        run: cargo install socketry-cargo-bake --locked
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --locked
      - run: cargo fmt --all -- --check
        if: matrix.runner == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.runner == 'ubuntu-latest'
      - name: Run tests and require complete source-region coverage
        run: cargo bake --locked test:coverage --all-targets true

  test-result:
    if: always()
    needs: [test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful tests and coverage
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
