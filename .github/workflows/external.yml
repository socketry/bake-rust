name: External Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Cargo launcher
        run: cargo install --path crates/cargo-bake --locked
      - name: Run downstream compatibility tests
        run: cargo bake --locked test:external
