name: Publish to crates.io

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check out the release task libraries for local development
        run: |
          git clone --depth 1 https://github.com/socketry/bake-releases-rust.git ../bake-releases-rust
          git clone --depth 1 https://github.com/socketry/bake-releases-cargo-rust.git ../bake-releases-cargo-rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    concurrency: publish-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out the release task libraries for local development
        run: |
          git clone --depth 1 https://github.com/socketry/bake-releases-rust.git ../bake-releases-rust
          git clone --depth 1 https://github.com/socketry/bake-releases-cargo-rust.git ../bake-releases-cargo-rust
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate workspace version from release tag
        id: packages
        shell: bash
        run: |
          cargo metadata --format-version 1 --no-deps --locked > "$RUNNER_TEMP/bake-metadata.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Unsupported release tag: {tag}")
          version = tag[1:]
          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "bake-metadata.json").read_text())
          packages = []
          for package in metadata["packages"]:
              publish = package.get("publish")
              if publish is False or isinstance(publish, list) and "crates-io" not in publish:
                  continue
              packages.append(package)
          if not packages:
              raise SystemExit("Workspace has no publishable packages")
          mismatched = [package["name"] for package in packages if package["version"] != version]
          if mismatched:
              raise SystemExit(f"Tag version {version} does not match workspace packages: {', '.join(mismatched)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"packages={json.dumps([package['name'] for package in packages])}\n")
          PY
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish workspace packages
        env:
          BAKE_PACKAGES: ${{ steps.packages.outputs.packages }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          arguments = ["cargo", "publish", "--locked"]
          for package in json.loads(os.environ["BAKE_PACKAGES"]):
              arguments.extend(["--package", package])
          subprocess.run(arguments, check=True)
          PY
