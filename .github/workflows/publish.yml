name: Publish to crates.io

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check out the release task libraries for local development
        run: |
          git clone --depth 1 https://github.com/socketry/bake-releases-rust.git ../bake-releases-rust
          git clone --depth 1 https://github.com/socketry/bake-releases-cargo-rust.git ../bake-releases-cargo-rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    concurrency: publish-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out the release task libraries for local development
        run: |
          git clone --depth 1 https://github.com/socketry/bake-releases-rust.git ../bake-releases-rust
          git clone --depth 1 https://github.com/socketry/bake-releases-cargo-rust.git ../bake-releases-cargo-rust
      - uses: dtolnay/rust-toolchain@stable
      - name: Find workspace packages that need publishing
        id: packages
        shell: bash
        run: |
          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/bake-metadata.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Unsupported release tag: {tag}")
          version = tag[1:]
          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "bake-metadata.json").read_text())
          workspace_members = set(metadata["workspace_members"])
          packages = []
          for package in metadata["packages"]:
              if package["id"] not in workspace_members:
                  continue
              publish = package.get("publish")
              if publish is False or isinstance(publish, list) and "crates-io" not in publish:
                  continue
              packages.append(package)
          if not packages:
              raise SystemExit("Workspace has no publishable packages")
          mismatched = [package["name"] for package in packages if package["version"] != version]
          if mismatched:
              raise SystemExit(f"Tag version {version} does not match workspace packages: {', '.join(mismatched)}")
          existing = []
          for package in packages:
              url = f"https://crates.io/api/v1/crates/{quote(package['name'], safe='')}/versions"
              request = Request(url, headers={"User-Agent": "socketry-bake-publish-workflow"})
              try:
                  with urlopen(request, timeout=30) as response:
                      registry = json.load(response)
              except HTTPError as error:
                  if error.code == 404:
                      continue
                  raise SystemExit(f"Could not check crates.io for {package['name']}: HTTP {error.code}")
              except (URLError, TimeoutError, json.JSONDecodeError) as error:
                  raise SystemExit(f"Could not check crates.io for {package['name']}: {error}")
              versions = registry.get("versions")
              if not isinstance(versions, list):
                  raise SystemExit(f"Unexpected crates.io response while checking {package['name']}")
              if any(item.get("num") == version for item in versions if isinstance(item, dict)):
                  existing.append(package["name"])
          missing = [package["name"] for package in packages if package["name"] not in existing]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"exclude={json.dumps(existing)}\n")
              output.write(f"has_packages={'true' if missing else 'false'}\n")
          PY
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.packages.outputs.has_packages == 'true'
      - name: Publish workspace packages
        if: steps.packages.outputs.has_packages == 'true'
        env:
          BAKE_EXCLUDE: ${{ steps.packages.outputs.exclude }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          arguments = ["cargo", "publish", "--workspace", "--locked"]
          for package in json.loads(os.environ["BAKE_EXCLUDE"]):
              arguments.extend(["--exclude", package])
          subprocess.run(arguments, check=True)
          PY
